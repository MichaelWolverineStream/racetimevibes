name: Update race data

"on":
  schedule:
    # Three times daily, off the top of the hour to avoid GitHub's scheduling backlog.
    - cron: "17 2 * * *"
    - cron: "17 4 * * *"
    - cron: "17 6 * * *"
    - cron: "17 8 * * *"
    - cron: "17 10 * * *"
    - cron: "17 12 * * *"
    - cron: "17 14 * * *"
    - cron: "17 16 * * *"
    - cron: "17 18 * * *"
    - cron: "17 20 * * *"
    - cron: "17 22 * * *"
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manually triggering the workflow"
        required: false
        default: "Webhook Trigger"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sync race archive
        run: python3 scripts/race_archive.py
      - name: Build data
        run: python3 scripts/build_stats.py
      - name: Detect changes
        id: changes
        # generated_at differs on every run, so ignore it when deciding whether the site changed.
        run: |
          python3 - <<'EOF'
          import json, os, subprocess

          site = False
          for path in (
              "site/data/race-stats.json",
              "site/data/participants.json",
              "site/data/comments.json",
          ):
              committed = subprocess.run(
                  ["git", "show", f"HEAD:{path}"],
                  capture_output=True, text=True,
              )
              # A dataset that HEAD does not have yet is new, so the site changed.
              if committed.returncode != 0:
                  site = True
                  continue
              old = json.loads(committed.stdout)
              with open(path, encoding="utf-8") as current:
                  new = json.load(current)
              old.pop("generated_at", None)
              new.pop("generated_at", None)
              site = site or old != new

          archive = bool(subprocess.run(
              ["git", "status", "--porcelain", "--", "archive"],
              check=True, capture_output=True, text=True,
          ).stdout.strip())

          print(f"Site changed: {site}; archive changed: {archive}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"site={'true' if site else 'false'}\n")
              output.write(f"archive={'true' if archive else 'false'}\n")
          EOF
      - name: Commit and push
        if: steps.changes.outputs.site == 'true' || steps.changes.outputs.archive == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Leave out site files whose only change is generated_at.
          if [ "${{ steps.changes.outputs.site }}" != "true" ]; then git checkout -- site/data; fi
          git add archive site/data
          git commit -m "$(date -u +%F) data"
          git pull --rebase origin main
          git push origin HEAD:main
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy explicitly.
      - name: Deploy
        if: steps.changes.outputs.site == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
